<!-- Write the code for a Django template that displays a list of student names passed from a view. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <ul>
        {% for student in students %}
    <li>{{ student.name }}</li>
         {% endfor %}
   </ul>
</body>
</html>

<!-- Show the template code that displays form errors if validation fails. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Fill User Form</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    <form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Submit</button>
</form>

{% if form.errors %}
  <ul>
    {% for field, errors in form.errors.items %}
      <li>{{ field }}: {{ errors|join:", " }}</li>
    {% endfor %}
  </ul>
{% endif %}
</body>
</html>
